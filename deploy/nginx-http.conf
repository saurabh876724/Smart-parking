# http-level directives shared by the plain-HTTP and the TLS entry configurations.
#
# Mounted at /etc/nginx/snippets/http.conf and `include`d at the top of
# deploy/nginx.conf / deploy/nginx.tls.conf. Those two files are themselves loaded
# through the image's `include /etc/nginx/conf.d/*.conf;`, which is http context,
# so `upstream`, `limit_req_zone` and `log_format` are legal here - and legal only
# here, which is why this list is separate from snippets/site.conf.

# Rate limiting zone (10 requests/second per IP)
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

upstream api_backend {
    server api:8000;
}

# The access log must not keep a URL's query string.
#
# Both credentials a browser can only put in a query string arrive through this
# proxy: a socket ticket in `/ws/live?ticket=…`, and - for an `<img>` tag, which
# cannot set a header - the camera stream's `?token=…`. nginx's built-in `combined`
# format logs `$request`, which is the whole request line *including* the query
# string, so the default log copies every credential that connects and keeps it on
# disk. `$uri` is the decoded path with the arguments left off: the same line, minus
# the secret.
#
# `escape=default` stops a percent-encoded newline in a path from writing a second,
# invented log row.
log_format sp_no_query escape=default
    '$remote_addr - $remote_user [$time_local] '
    '"$request_method $uri $server_protocol" '
    '$status $body_bytes_sent "$http_referer" '
    '"$http_user_agent"';
