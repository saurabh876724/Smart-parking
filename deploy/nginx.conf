# nginx entry configuration - plain HTTP, no TLS. This is the local-development
# and TLS-less deployment.
#
# HTTPS is a different entry file (`deploy/nginx.tls.conf`) chosen by
# `deploy/docker-compose.tls.yml`, because nginx cannot define a TLS server "only if
# the certificates happen to be present": a `listen 443 ssl` whose `ssl_certificate`
# is missing stops the proxy at startup, and `deploy/ssl/` is empty until someone
# puts a certificate and key in it. So the choice is made by which file gets mounted
# at /etc/nginx/conf.d/default.conf, and `docker-compose.yml` publishes port 80 only
# - publishing 443 with TLS unconfigured advertised an HTTPS that never existed,
# where a browser got a reset connection instead of a certificate warning and
# nothing in the config said why.
#
# Both entry files include the same two snippets, so the routing rules and the
# http-level directives exist once:
#   /etc/nginx/snippets/http.conf  - upstream, rate-limit zone, log format
#   /etc/nginx/snippets/site.conf  - headers and every `location`
#
# Same-origin by design: the bundle calls the host that served it and these
# locations forward /api, /ws and the MJPEG stream to the FastAPI container, which
# is why configs/app.yaml ships an empty `api.cors` allow-list.

include /etc/nginx/snippets/http.conf;

server {
    listen 80;
    server_name _;

    include /etc/nginx/snippets/site.conf;
}
