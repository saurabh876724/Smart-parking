# Server-level routing for the Smart Parking dashboard, shared by the plain-HTTP
# and the TLS entry configurations.
#
# This file is mounted at /etc/nginx/snippets/site.conf and `include`d inside a
# `server` block, never dropped into /etc/nginx/conf.d: the image's own
# /etc/nginx/nginx.conf does `include /etc/nginx/conf.d/*.conf;` at **http** level,
# and a `location` outside a `server` is a startup error. Same reason the http-level
# directives live in snippets/http.conf and not here.
#
# The two entry files (deploy/nginx.conf, deploy/nginx.tls.conf) differ only in how
# the connection arrives; what the proxy does once it has is this one list.

# Written to the access log without the query string (`sp_no_query`, defined in
# snippets/http.conf). A server-level `access_log` replaces the one the image's
# main config inherits, so this is the only copy the request makes.
access_log /var/log/nginx/access.log sp_no_query;

# Security headers
add_header X-Frame-Options DENY;
add_header X-Content-Type-Options nosniff;
add_header X-XSS-Protection "1; mode=block";
add_header Referrer-Policy strict-origin-when-cross-origin;

# Health check endpoint
location /health {
    access_log off;
    return 200 'OK';
    add_header Content-Type text/plain;
}

# API routes - proxy to FastAPI backend
location /api/ {
    limit_req zone=api burst=20 nodelay;

    proxy_pass http://api_backend;
    proxy_http_version 1.1;

    # Preserve original headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # No CORS headers here on purpose: the browser talks to this same origin, so
    # CORS never applies. The API's own allow-list (configs/app.yaml -> api.cors)
    # is the only place origins are ever named.
}

# MJPEG stream: a buffered multipart response never reaches the <img> tag, so the
# stream needs its own location ahead of the rate-limited /api/ one.
location ~* ^/api/v1/cameras/[^/]+/stream\.mjpg$ {
    # See the note in `location /ws/` below: an upstream failure is the one nginx
    # log line that quotes the whole request URL *with* its query string, and this
    # is the other location whose query string carries a credential.
    error_log /var/log/nginx/error.log crit;

    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 86400s;
}

# WebSocket endpoints - upgrade connection.
#
# `proxy_pass` with no URI forwards the original path *with* its query string,
# which is how a socket ticket reaches the app; the log format in
# snippets/http.conf simply does not write the query string down. Nothing here
# rewrites `$args`, and doing so would break the handshake rather than protect it.
location /ws/ {
    # The access log is not the only place a URL is written down. When the proxy
    # cannot reach the backend, nginx logs the failure at `error` level and quotes
    # the request line *including the query string*, plus the upstream URL it tried:
    #   [error] ... connect() failed ... request: "GET /ws/live?ticket=… HTTP/1.1",
    #                 upstream: "http://127.0.0.1:8000/ws/live?ticket=…"
    # which is a live socket ticket in the error log, on the one day the API was
    # restarting. `crit` hides that class of message for this location only. What it
    # costs is an upstream failure notice - the 502 still reaches the access log,
    # and a refused ticket is still answered by the app with a close code, so
    # nothing the dashboard can see is lost.
    error_log /var/log/nginx/error.log crit;

    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
}

# Frontend static assets - serve from built React app
location / {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri/ /index.html;

    # Cache static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
