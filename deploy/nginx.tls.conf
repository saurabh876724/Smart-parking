# nginx entry configuration - TLS termination. This is the production file, and
# it is only ever mounted when certificates exist.
#
# Enable with:
#   docker compose -f docker-compose.yml -f docker-compose.tls.yml up -d
# which puts *this* file at /etc/nginx/conf.d/default.conf instead of the plain
# HTTP one, mounts deploy/ssl read-only, and publishes 443 alongside 80. With the
# base file alone, 443 is not mapped at all: nginx cannot make a TLS server
# conditional on a file existing, so the switch belongs at the deployment level.
#
# deploy/ssl/fullchain.pem and deploy/ssl/privkey.pem have to be a real pair for
# the host name people type. If either is missing, nginx refuses to start and says
# so (`docker compose logs nginx`), which is the intended outcome - a proxy that
# came up quietly without a usable certificate is how an "HTTPS deployment" ends up
# serving nothing, or serving HTTP under somebody's assumption.
#
# The routing itself is the same snippets the HTTP entry includes, so `/api`,
# `/ws` and the MJPEG stream behave identically over either.

include /etc/nginx/snippets/http.conf;

# Everything that arrives unencrypted goes to the encrypted listener. This is the
# only `server` on port 80 in this file set, which is what makes the redirect safe
# to state without a name match.
server {
    listen 80;
    server_name _;

    # ACME http-01 challenges are served by certbot's own container or webroot on
    # the host, not by this proxy; if you renew that way, add
    #   location /.well-known/acme-challenge/ { root /var/www/certbot; }
    # above this line and it will not be redirected.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;

    # Not sent by default, on purpose: `Strict-Transport-Security` is a promise the
    # browser keeps for `max-age` seconds even after the certificate is gone, and a
    # self-signed certificate on `localhost` makes that promise unfixable from the
    # dashboard's own history. Turn it on once the host has a certificate a browser
    # trusts without a warning page:
    #   add_header Strict-Transport-Security "max-age=31536000" always;

    include /etc/nginx/snippets/site.conf;
}
