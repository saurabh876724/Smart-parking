# Smart Parking Management System - Production Deployment
# One-command startup: docker compose up -d

services:
  # ─── Database ───────────────────────────────────────────────────────
  # Optional for now: the application runs on SQLite (data/smart_parking.db,
  # host-mounted and writable), which is the recorded decision until the
  # Postgres switch. Start this service with `--profile postgres` when that
  # switch happens, and point SMART_PARKING_DATABASE_URL at it - one line in
  # the api block below, nothing else.
  db:
    image: postgres:15-alpine
    container_name: smart-parking-db
    restart: unless-stopped
    profiles: ["postgres"]
    environment:
      POSTGRES_DB: smart_parking
      POSTGRES_USER: parking_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parking_admin -d smart_parking"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  # ─── Backend API ────────────────────────────────────────────────────
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    container_name: smart-parking-api
    restart: unless-stopped
    # Same as the image CMD, plus --persist so the cameras' FSM transitions are
    # written to the database. Without it the API is read-only and every bay
    # stays UNKNOWN, so the dashboard shows no occupancy.
    command: ["sh", "-c", "python3 scripts/migrate.py upgrade head && python3 scripts/serve.py --host 0.0.0.0 --persist"]
    environment:
      SMART_PARKING_JWT_SECRET: ${SMART_PARKING_JWT_SECRET:?Set SMART_PARKING_JWT_SECRET in deploy/.env}
      # The one database URL name, read by both the migrations and the running
      # API (core.config.database_url_for). SQLite today: the file lives in the
      # host-mounted data/ directory, so every record survives a container
      # rebuild. The old DATABASE_URL variable was read by nothing - the app
      # took its URL from configs/app.yaml - which is how compose could advertise
      # Postgres while the API wrote SQLite. Switching backends is this one line
      # plus `--profile postgres` on the db service.
      SMART_PARKING_DATABASE_URL: sqlite:///data/smart_parking.db
      # The mounted source tree shadows the copy baked into the image, so a code
      # change deploys with a container restart instead of an image rebuild
      # (whose pip layer needs a network this machine does not always have).
      PYTHONPATH: /app/src
      PYTHONUNBUFFERED: "1"
      # /health is authenticated by design (it leaks camera names + error paths),
      # so the liveness probe logs in first; a 200 from /auth/login proves the API,
      # the database and the auth layer are all up.
      HEALTH_EMAIL: ${HEALTH_EMAIL:?Set HEALTH_EMAIL in deploy/.env}
      HEALTH_PASSWORD: ${HEALTH_PASSWORD:?Set HEALTH_PASSWORD in deploy/.env}
    volumes:
      - ../data:/app/data
      - ../configs:/app/configs:ro
      - ../models:/app/models:ro
      - ../src:/app/src:ro
      - ../tests:/app/tests:ro
    ports:
      - "8000:8000"
    runtime: nvidia
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -X POST http://localhost:8000/api/v1/auth/login -H 'Content-Type: application/json' -d '{\"email\":\"'$HEALTH_EMAIL'\",\"password\":\"'$HEALTH_PASSWORD'\"}' -o /dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 4G

  # ─── Frontend (built, then served by nginx) ─────────────────────────
  # One-shot job, not a server: it builds the React app and writes the bundle
  # straight into the host directory nginx serves. `compose up -d --build`
  # therefore always publishes a fresh dist - the old named volume received the
  # build while nginx read a different, stale directory from the host.
  frontend-build:
    build:
      context: ../frontend
      dockerfile: ../deploy/Dockerfile.frontend-build
    container_name: smart-parking-frontend-build
    restart: "no"
    volumes:
      - ../frontend/dist:/app/dist

  # ─── nginx Reverse Proxy ────────────────────────────────────────────
  # Plain HTTP: this service publishes 80 and nothing else. TLS is the same
  # container started from a different entry file, which is what
  # `docker compose -f docker-compose.yml -f docker-compose.tls.yml up -d` does -
  # that second file adds the 443 mapping, mounts deploy/ssl, and swaps
  # nginx.conf for nginx.tls.conf at /etc/nginx/conf.d/default.conf. There is no
  # `listen 443 ssl` in any file that can be started without certificates, so a
  # port 443 here would be a promise the deployment could not keep.
  nginx:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.nginx
    container_name: smart-parking-nginx
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
      frontend-build:
        condition: service_completed_successfully
    volumes:
      - ../frontend/dist:/usr/share/nginx/html:ro
      # Two snippets shared by both entry configurations, so the routing rules and
      # the http-level directives are written once. `/etc/nginx/snippets` is not
      # globbed by the image's own config (only `conf.d/*.conf` is), which is the
      # only reason these are not sitting next to nginx.conf.
      - ./nginx-http.conf:/etc/nginx/snippets/http.conf:ro
      - ./nginx-site.conf:/etc/nginx/snippets/site.conf:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  pgdata:
    driver: local
