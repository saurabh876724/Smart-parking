# Alembic configuration for the smart parking database (Phase 7).
#
# There is deliberately no `sqlalchemy.url` in this file. The URL lives in
# configs/app.yaml under `database:` and is resolved by
# `smart_parking.core.config.database_url_for`, which is what `env.py` calls -
# so the pipeline and the migrations can never disagree about which file the
# database is. To migrate somewhere else for once, override it:
#
#   py -3.10 -m alembic -x url=sqlite:///data/scratch.db upgrade head

[alembic]
# POSIX separators: this path is read on Windows and Linux alike.
script_location = %(here)s/src/smart_parking/db/migrations

# The package is not installed site-wide on this machine, so the source tree is
# put on sys.path for the migration scripts and for env.py's own imports.
prepend_sys_path = src

path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
