[project]
name = "smart-parking"
version = "0.1.0"
description = "AI-based smart parking management system: YOLO detection, slot occupancy FSM, ANPR, FastAPI, React"
requires-python = ">=3.10"
dependencies = [
    "opencv-python>=4.9",
    "ultralytics>=8.4",
    "torch>=2.2",
    "shapely>=2.0",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "numpy>=1.26",
]

[project.optional-dependencies]
db = [
    # Phase 7: the persistence layer on its own. Separated from `backend` because
    # a pipeline run that writes rows needs no web framework.
    "sqlalchemy>=2.0",
    "alembic>=1.13",
]
backend = [
    "smart-parking[db]",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "python-jose[cryptography]>=3.3",
    # Used directly rather than through passlib: `api/security.py` builds an
    # argon2.PasswordHasher from the cost parameters in configs/app.yaml, and
    # passlib's argon2 handler is a wrapper over this same library that takes those
    # parameters away from config.
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.9",
]
anpr = [
    "rapidocr-onnxruntime>=1.4,<2",  # PP-OCRv4 det+rec ONNX, models bundled, CPU only
    "onnxruntime>=1.16",
    "rapidfuzz>=3.9",                # Levenshtein distance for plate repair and scoring
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
src = ["src"]
